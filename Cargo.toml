[package]
name         = "signal-spirit-judge"
version      = "2.0.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-spirit-judge"
description  = "Typed Spirit judge request and reply Signal contract."
publish      = false
include      = ["Cargo.toml", "Cargo.lock", "README.md", "ethos/**", "src/**", "tests/**", "build.rs"]

[lib]
name = "signal_spirit_judge"
path = "src/lib.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-spirit/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "627db67f2655efd9f786864009955005fd8ab2ad", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "171b21f65337983ab624b7b906397a4f1f92c5a3", optional = true }
rkyv           = { version = "=0.8.18", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-spirit = { git = "https://github.com/LiGoldragon/signal-spirit.git", rev = "c1d78e85ef8ca04f816ea02047c3c60428c42f84", default-features = false }
thiserror      = "2"

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "de3d9928b156f2e1a92d060b7817af201abfdbef" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
