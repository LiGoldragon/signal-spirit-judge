[package]
name         = "signal-spirit-judge"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-spirit-judge"
description  = "Typed Spirit judge request and reply Signal contract."
publish      = false
include      = ["Cargo.toml", "Cargo.lock", "README.md", "schema/**", "src/**", "tests/**"]

[lib]
name = "signal_spirit_judge"
path = "src/lib.rs"

[features]
default = []
nota-text = ["dep:nota", "signal-frame/nota-text", "signal-spirit/nota-text"]

[dependencies]
nota           = { package = "nota", git = "https://github.com/LiGoldragon/nota.git", rev = "89dc3c85a9ff96d4e4d53accfd867df672cae5a8", optional = true }
rkyv           = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame   = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "e27bbb5752f133589ba3200c3aace1b350c5123e", default-features = false }
signal-spirit  = { git = "https://github.com/LiGoldragon/signal-spirit.git", rev = "d2589210c87bcae08386c4b645fc1d7eb49a139c", default-features = false }
thiserror      = "2"

[dev-dependencies]
schema-language = { git = "https://github.com/LiGoldragon/schema-language.git", rev = "9c217610c4b8d3bdaa9f95542e28c04424a593e3" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
