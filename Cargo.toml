[package]
name         = "signal-spirit-judge"
version      = "3.1.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-spirit-judge"
description  = "Typed Spirit judge request and reply Signal contract."
publish      = false
include      = ["Cargo.toml", "Cargo.lock", "README.md", "ethos/**", "src/**", "tests/**", "build.rs"]

[lib]
name = "signal_spirit_judge"
path = "src/lib.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-spirit/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3", optional = true }
rkyv           = { version = "=0.8.18", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-spirit = { git = "https://github.com/LiGoldragon/signal-spirit.git", rev = "3a0b62f", default-features = false }
thiserror      = "2"

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "5a5daca315ab24460ccbcd5038130c453e853e6e" }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
